{% extends "layout.html" %}

{% block title %}Kappaleet{% endblock %}

{% block content %}
    <h2>Kappaleet</h2>
  <form action="{{ url_for('create_item') }}" method="post">
    <p>
      Kappale: <br />
      <input type="text" name="title" maxlength="50" required />
    </p>
    <p>
      Artisti: <br />
      <input type="text" name="artist" maxlength="50" required />
    </p>
    <p>
      Tabulatuuri: <br />
      <textarea rows="10" cols="50" name="tabulatuuri" maxlength="1000" required></textarea>
    </p>
    {% for class in classes %}
    <p>
      {{ class }}:<br />
      <select name="classes">
        <option value="">Valitse</option>
      {% for option in classes[class] %}
      <option value="{{ class }}:{{ option }}">{{ option }}</option>
      {% endfor %}
      </select>
      </p>
    {% endfor %}
    <input type="submit" value="Luo kappale" />
  </form>
{% endblock %}
