<!DOCTYPE html>
<html>

<head>
  <title>Kappaleet</title>
</head>

<body>
    <h1>Kappaleet</h1>
  <form action="{{ url_for('create_item') }}" method="post">
    <p>
      Kappale: <br />
      <input type="text" name="title" maxlength="50" required />
    </p>
    <p>
      Artisti: <br />
      <input type="text" name="artist" maxlength="50" required />
    </p>
    <p>
      Tabulatuuri: <br />
      <textarea rows="10" cols="50" name="tabulatuuri" maxlength="1000" required></textarea>
    </p>
    <p>
      Genre:<br />
      <select name="Genre">
        <option value="">Valitse genre</option>
        <option value="rock">rock</option>
        <option value="metal">metal</option>
        <option value="jazz">jazz</option>
        <option value="pop">pop</option>
      </select>
    </p>
    <p>
      Vaikeustaso:<br />
      <select name="vaikeustaso">
        <option value="">Valitse vaikeustaso</option>
        <option value="aloittelija">aloittelija</option>
        <option value="keskitasoinen">keskitasoinen</option>
        <option value="kokenut">kokenut</option>
      </select>
    </p>
    <input type="submit" value="Luo kappale" />
  </form>

</body>

</html>
