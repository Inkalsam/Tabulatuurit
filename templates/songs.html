<!DOCTYPE html>
<html>

<head>
  <title>Kappaleet</title>
</head>

<body>
    <h1>Kappaleet</h1>
  <form action="{{ url_for('create_item') }}" method="post">
    <p>
      Kappale: <br />
      <input type="text" name="title" required />
    </p>
    <p>
      Artisti: <br />
      <input type="text" name="artist" required />
    </p>
    <p>
      Tabulatuuri: <br />
      <textarea rows="10" cols="50" name="tabulatuuri" required></textarea>
    </p>
    <input type="submit" value="Luo kappale" />
  </form>

  <h2>Kaikki kappaleet</h2>
  {% if songs %}
    {% for song in songs %}
      <article>
        <h3>{{ song.title }} - {{ song.artist }}</h3>
        <pre>{{ song.tab }}</pre>
      </article>
    {% endfor %}
  {% else %}
    <p>Ei vielä kappaleita.</p>
  {% endif %}
</body>

</html>
