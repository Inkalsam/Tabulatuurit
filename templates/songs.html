{% extends "layout.html" %}

{% block title %}Kappaleet{% endblock %}

{% block content %}
    <h2>Kappaleet</h2>
  <form action="{{ url_for('create_item') }}" method="post">
    <p>
      <label for="title">Kappale:</label><br />
      <input type="text" name="title" id="title" maxlength="50" value="{{ title }}" required />
    </p>
    <p>
      <label for="artist">Artisti:</label><br />
      <input type="text" name="artist" id="artist" maxlength="50" value="{{ artist }}" required />
    </p>
    <p>
      <label for="tabulatuuri">Tabulatuuri:</label><br />
      <textarea id="tabulatuuri" rows="6" cols="50" name="tabulatuuri" maxlength="1000" required>{{ tabulatuuri }}</textarea>
    </p>
    <p>
      <button type="submit" name="action" value="add_measure" formnovalidate>Lisää tahti</button>
    </p>
    {% for class in classes %}
    <p>
      <label for="class-{{ loop.index }}">{{ class }}:</label><br />
      <select id="class-{{ loop.index }}" name="classes">
        <option value="" {% if not selected_classes %}selected{% endif %}>Valitse</option>
      {% for option in classes[class] %}
      <option value="{{ class }}:{{ option }}" {% if (class ~ ':' ~ option) in selected_classes %}selected{% endif %}>{{ option }}</option>
      {% endfor %}
      </select>
      </p>
    {% endfor %}
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" value="Luo kappale" />
  </form>
{% endblock %}
