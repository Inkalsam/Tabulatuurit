{% extends "layout.html" %}

{% block title %}{{ user.username }}{% endblock %}

{% block content %}

    <h2> käyttäjä {{ user.username }}</h2>
    <p>Käyttäjällä on yhteensä {{ songs|length }} kappaletta.</p>
    <h3>Kappaleet:</h3> 

    <ul>
        {% for song in songs %}
        <li><a href="{{ url_for('song', song_id=song.id) }}">{{ song.title }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
